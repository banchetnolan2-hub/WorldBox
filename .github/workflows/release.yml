# Construit WorldSimulator.exe (portable) et l'installateur sous Windows, puis les publie dans une release GitHub.
# Déclenchement : manuel (Actions → Release Windows → Run workflow), en poussant un tag v*, ou en poussant
# sur la branche de développement (tag = v + version du package.json ; la release est mise à jour).
name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. v3.1.0)'
        required: true
        default: 'v3.1.0'
  push:
    tags: ['v*']
    branches: ['claude/kind-galileo-qxpu6r']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag de la release
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then t="${{ github.event.inputs.tag }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then t="${{ github.ref_name }}";
          else t="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - name: Construire WorldSimulator.exe et l'installateur
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: WorldSimulator ${{ steps.tag.outputs.tag }}
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            WorldSimulator pour Windows (64 bits).
            - **WorldSimulator.exe** : version portable, à lancer directement (aucune installation).
            - **WorldSimulator-Setup-*.exe** : installateur (raccourci sur le bureau).
            Nouveautés : voir la section « VERSION 3.1 » du README.
          files: |
            release/WorldSimulator.exe
            release/WorldSimulator-Setup-*.exe
